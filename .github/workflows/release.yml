name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  COMMERCE_AGENTS_REF: fd4d59224ab96b43c6dc6888207c67b3bd5a24cf

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install and test
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -e .
          python -m pip install pylint==4.0.7 isort==8.0.1
          python -m unittest discover -s tests
          pylint --max-line-length=100 src/mercadopago_commerce_agents examples
          isort --check-only --diff src tests examples

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: anthropics/commerce-agents
          ref: ${{ env.COMMERCE_AGENTS_REF }}
          path: commerce-agents
          persist-credentials: false

      - name: Test the release against the reviewed commerce-agents commit
        env:
          REQUIRE_COMMERCE_AGENTS: '1'
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -e .
          python -m pip install ./commerce-agents/commerce-common ./commerce-agents/shopping-agent/core
          python -m unittest tests.test_contract -v

  build:
    needs: [test, contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install --upgrade pip==26.2.1 build==1.5.0 twine==7.0.0

      - name: Verify release tag matches package version
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v${package_version}" = "${GITHUB_REF_NAME}"

      - name: Verify the release tag signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.type')"
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.sha')"
          test "${tag_type}" = "tag"
          verified="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.verification.verified')"
          test "${verified}" = "true"

      - name: Verify the tagged commit belongs to main
        run: |
          git show-ref --verify --quiet refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main

      - name: Build and validate distributions
        env:
          # Constrain the isolated build environment so the artifact does not depend on
          # whatever setuptools happens to be newest that day, and stays above the fixed
          # release of GHSA-h35f-9h28-mq5c.
          PIP_CONSTRAINT: build-constraints.txt
        run: |
          printf 'setuptools>=83.0.0,<85\nwheel>=0.45,<1\n' > build-constraints.txt
          python -m build
          python -m twine check dist/*
          rm build-constraints.txt

      - name: Audit what the artifact actually resolves
        run: |
          set -euo pipefail
          # The CI job audits a development environment; this audits the environment a
          # user gets from this wheel, which is the one that ships.
          python -m venv /tmp/artifact-check
          /tmp/artifact-check/bin/pip install --upgrade pip==26.2.1
          /tmp/artifact-check/bin/pip install dist/*.whl
          /tmp/artifact-check/bin/pip check
          # Prove the wheel imports before removing only the unpublished root package.
          # Its installed dependencies remain and are what pip-audit evaluates below.
          /tmp/artifact-check/bin/python -c "import mercadopago_commerce_agents as m; print(m.__all__)"
          /tmp/artifact-check/bin/pip uninstall --yes mercadopago-commerce-agents-checkout
          /tmp/artifact-check/bin/pip install "pip-audit==2.9.0"
          /tmp/artifact-check/bin/pip-audit --strict --desc

      - name: Store distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/mercadopago-commerce-agents-checkout
    permissions:
      id-token: write
    steps:
      - name: Retrieve distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/

      # Trusted Publishing uses short-lived OIDC credentials and twine.
      - name: Publish to TestPyPI
        env:
          TWINE_NON_INTERACTIVE: "1"
        run: |
          set -euo pipefail
          python -m pip install --upgrade "twine==6.2.0"
          oidc_response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=testpypi")
          oidc=$(jq --raw-output '.value' <<< "${oidc_response}")
          token_response=$(curl --fail-with-body --silent --show-error \
            -X POST https://test.pypi.org/_/oidc/mint-token \
            -H 'Content-Type: application/json' \
            --data "$(jq --null-input --arg token "${oidc}" '{token: $token}')")
          token=$(jq --raw-output '.token' <<< "${token_response}")
          # Without this the minted token would appear in the log if any later step
          # echoed it. The official sdk-python workflow masks it the same way.
          echo "::add-mask::${token}"
          TWINE_USERNAME=__token__ TWINE_PASSWORD="${token}" \
            python -m twine upload --repository-url https://test.pypi.org/legacy/ dist/*

  publish-pypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mercadopago-commerce-agents-checkout
    permissions:
      id-token: write
    steps:
      - name: Retrieve distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        env:
          TWINE_NON_INTERACTIVE: "1"
        run: |
          set -euo pipefail
          python -m pip install --upgrade "twine==6.2.0"
          oidc_response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pypi")
          oidc=$(jq --raw-output '.value' <<< "${oidc_response}")
          token_response=$(curl --fail-with-body --silent --show-error \
            -X POST https://pypi.org/_/oidc/mint-token \
            -H 'Content-Type: application/json' \
            --data "$(jq --null-input --arg token "${oidc}" '{token: $token}')")
          token=$(jq --raw-output '.token' <<< "${token_response}")
          # Without this the minted token would appear in the log if any later step
          # echoed it. The official sdk-python workflow masks it the same way.
          echo "::add-mask::${token}"
          TWINE_USERNAME=__token__ TWINE_PASSWORD="${token}" \
            python -m twine upload dist/*
