[build-system]
# 80.9.0 is affected by GHSA-h35f-9h28-mq5c (sdist MANIFEST.in bypass), fixed in 83.0.0.
requires = ["setuptools >= 83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mercadopago-commerce-agents-checkout"
version = "0.1.0"
authors = [{ name = "Mercado Pago", email = "mp_sdk@mercadopago.com" }]
description = "Mercado Pago Checkout Pro via Orders API for commerce-agents"
readme = "README.md"
# Keep the distribution discoverable by product, framework and integration style.
keywords = [
    "mercadopago",
    "mercado-pago",
    "checkout",
    "checkout-pro",
    "checkout-handoff",
    "checkout-url",
    "commerce-agents",
    "shopping-agent",
    "agentic-commerce",
    "ai-agents",
    "orders-api",
    "payments",
    "python-sdk",
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# commerce-agents' own floor: shopping-agent-core declares requires-python >= 3.11.
# Nothing here needs 3.11, but a host that cannot run the agent cannot use this either.
requires-python = ">=3.11"
dependencies = [
    # Floor is the version this was tested end-to-end against, not the oldest that
    # might work: it is what a fresh install resolves to anyway, and a payment path is
    # the wrong place to be generous about an untested range.
    "mercadopago>=3.5.0",
    # Used directly for its exception types when catching transport failures.
    "requests>=2.33.0,<3",
    # Security floors for requests' transitive HTTP stack. Declaring them here also
    # upgrades an already-installed but vulnerable version that still satisfies
    # requests' intentionally broad compatibility ranges.
    "certifi>=2024.7.4",
    "idna>=3.15,<4",
    "urllib3>=2.7.0,<3",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# Deliberately NOT a dependency: shopping-agent-core. It is versioned 0.1.0.dev0 and
# pins commerce-common==0.1.0.dev0 precisely so that a lone install fails rather than
# resolving a public distribution of the same name, so depending on it would make this
# package uninstallable from PyPI at best and a dependency-confusion risk at worst.
# src/mercadopago_commerce_agents/types.py carries the one type we need instead. To run
# the contract test against the real thing, install it from a clone — see the README.

[project.urls]
Homepage = "https://www.mercadopago.com.br/developers"
Documentation = "https://github.com/mercadopago/commerce-agents-checkout#readme"
Issues = "https://github.com/mercadopago/commerce-agents-checkout/issues"
Source = "https://github.com/mercadopago/commerce-agents-checkout"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mercadopago_commerce_agents = ["py.typed"]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src", "tests", "examples"]
