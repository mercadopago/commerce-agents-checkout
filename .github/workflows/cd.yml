# Publishes to PyPI on a GitHub release, like mercadopago/sdk-python's cd.yml, with one
# deliberate difference: this uses PyPI Trusted Publishing (OIDC) instead of a
# long-lived API token in `secrets.PYPI_TOKEN`. PyPI mints a short-lived credential for
# this repository and workflow, so there is no permanent publishing secret to leak or
# rotate. Setup is one step on PyPI: the project's "Publishing" tab, adding this
# repository, this workflow filename, and the environment below as a trusted publisher.
name: CD - Upload PyPI

on:
  release:
    types: [released]

jobs:
  upload:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for Trusted Publishing; nothing else needs write access.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
